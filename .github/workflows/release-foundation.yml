name: release-foundation

on:
  workflow_dispatch:
    inputs:
      from_channel:
        description: Source release channel to validate and promote
        required: true
        default: canary
        type: choice
        options:
          - canary
          - beta
      to_channel:
        description: Target release channel for promotion
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable

jobs:
  macos-release-foundation:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      SHIPKIT_RELEASE_CHANNEL: ${{ inputs.from_channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.28.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package:smoke
      - run: pnpm run release:preflight
      - run: pnpm run updater:scaffold
      - run: pnpm run release:bundle
      - run: pnpm run release:validate-feed
      - run: pnpm run release:promote -- --from ${{ inputs.from_channel }} --to ${{ inputs.to_channel }}
      - uses: actions/upload-artifact@v7
        with:
          name: shipkit-release-foundation-${{ inputs.from_channel }}-to-${{ inputs.to_channel }}
          path: .release-results
          if-no-files-found: error
          retention-days: 14
